<div class="row">
    <div class="col-md-8 offset-md-2 mb-4 md-mb-0">
        <app-post-form></app-post-form>
    </div>
</div>
<div class="row">
    <ng-container *ngIf="postArr.length > 0;else nopost">
        <div class="col-md-4 mb-4"  *ngFor="let post of postArr;trackBy:trackById">
            <app-post-card [postObj]="post"></app-post-card>
         </div>
    </ng-container>
    <ng-template #nopost>
        <p>
            No Post Available !!
        </p>
    </ng-template>
</div>
